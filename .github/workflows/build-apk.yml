name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            wget \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "build-tools;37.0.0"

      - name: Create Android SDK compatibility path
        run: |
          echo "Android SDK: $ANDROID_SDK_ROOT"

          SDKMANAGER_PATH="$(command -v sdkmanager)"
          echo "sdkmanager found at: $SDKMANAGER_PATH"

          CMDLINE_TOOLS_DIR="$(dirname "$(dirname "$SDKMANAGER_PATH")")"
          echo "Command line tools directory: $CMDLINE_TOOLS_DIR"

          if [ ! -e "$ANDROID_SDK_ROOT/tools" ]; then
            ln -s "$CMDLINE_TOOLS_DIR" "$ANDROID_SDK_ROOT/tools"
          fi

          echo "Checking compatibility path:"
          ls -la "$ANDROID_SDK_ROOT/tools/bin/"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

      - name: Show Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Installed SDK packages:"
          sdkmanager --list_installed

          echo "Build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo "AIDL files:"
          find "$ANDROID_SDK_ROOT/build-tools" -name aidl -type f -print

      - name: Prepare Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s "$ANDROID_SDK_ROOT" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          ls -la "$HOME/.buildozer/android/platform/"

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36

      - name: Build APK
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          ~/.local/bin/buildozer -v android debug

      - name: List APK files
        if: success()
        run: |
          echo "APK files:"
          find bin -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeltaDualTrader-debug-apk
          path: bin/*.apk
